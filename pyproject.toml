[project]
name = "mailauto"
version = "0.1.0"
description = "Plataforma de automatizacion de correos: ingesta de adjuntos y extraccion de datos tributarios"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    # Web
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    # Datos
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    # Cola y cache
    "arq==0.28.0",
    # ARQ 0.28 exige redis<6. Subir el cliente obliga a cambiar de cola,
    # asi que se queda en la ultima 5.x hasta que ARQ lo soporte.
    "redis==5.3.1",
    # Seguridad
    "cryptography==50.0.2",
    "pyjwt[crypto]==2.15.1",
    "authlib==1.8.0",
    # Clientes externos
    "httpx==0.28.1",
    "aioboto3==15.5.0",
    # Restriccion directa sobre una transitiva de botocore: la version
    # que arrastra tiene CVE-2026-97687. Se fija aqui para que el
    # resolutor no pueda elegir una anterior.
    "urllib3>=2.8.0",
    # Extraccion de documentos
    # Las tres estrategias de lectura, de la mas barata a la mas cara.
    # Solo se instalan en la imagen del worker: la API no abre ficheros.
    "pymupdf==1.28.2",
    "pdfplumber==0.11.10",
    "pytesseract==0.3.13",
    # Variante headless: la imagen del worker no tiene servidor grafico,
    # y la completa arrastra GTK y medio escritorio sin usarlo.
    "opencv-python-headless==5.0.0.93",
    "pillow==12.3.0",
    # Vision IA: ultimo recurso del pipeline de extraccion. Groq es el
    # proveedor activo (API compatible con OpenAI); anthropic queda como
    # alternativa seleccionable por configuracion.
    "openai==3.28.0",
    "anthropic==1.11.0",
    # Reportes
    "openpyxl==3.1.5",
    # Observabilidad
    "structlog==26.1.0",
    "opentelemetry-api==1.45.0",
    "opentelemetry-sdk==1.45.0",
    "opentelemetry-instrumentation-fastapi==0.66b0",
    "opentelemetry-instrumentation-sqlalchemy==0.66b0",
    "opentelemetry-exporter-otlp-proto-http==1.45.0",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
# Separado de `integration` a proposito: la suite unitaria y el linting
# son lo que corre en cada guardado y en cada push, y deben instalarse en
# segundos. Testcontainers y schemathesis arrastran mucho mas peso y solo
# hacen falta en el job de integracion.
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.4",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "import-linter==2.15",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]
integration = [
    "testcontainers[postgres,redis]==4.15.0",
    "schemathesis==4.29.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ─────────────────────────────────────────────────────────────────────
# Ruff — linting y formateo
# ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "DTZ",       # datetimes sin zona horaria
    "T20",       # print / pdb olvidados
    "SIM",       # simplificaciones
    "TID",       # imports relativos
    "RUF",       # reglas propias de ruff
    "S",         # bandit
    "ASYNC",     # errores de async
    # `except Exception` sin justificar. El sistema tiene varias
    # fronteras donde atraparlo todo es correcto (un worker, un motor
    # de lectura, el borde HTTP); esta regla obliga a que cada una
    # lleve su `noqa` con el motivo escrito, en vez de que se cuelen
    # capturas ciegas por descuido.
    "BLE",
    # `Any` en una anotacion. Se usa en los adaptadores que tocan
    # OpenCV o SDKs sin tipos; la regla exige justificarlo caso a caso.
    "ANN401",
]
ignore = [
    "S101",      # assert: legitimo en tests
    "B008",      # Depends() en defaults es el idioma de FastAPI
    # `from sqlalchemy.dialects.postgresql import UUID as PgUUID` es el
    # idioma estandar de SQLAlchemy y el alias es imprescindible para no
    # colisionar con `uuid.UUID`, que se usa en el mismo fichero.
    "N811",
    # La jerarquia de errores esta nombrada en español y ya empieza por
    # "Error" (ErrorDeDominio, ErrorDeValidacion). Exigir el sufijo
    # ingles produciria "ErrorDeDominioError".
    "N818",
    # Sintaxis PEP 695 de genericos (`class Pagina[T]`). Es valida en el
    # 3.12 que el proyecto exige, pero `Generic[T]` tambien lo es y es
    # lo que entiende cualquier herramienta y cualquier persona que
    # venga de una base de codigo anterior. Migrar es un cambio de
    # estilo sin ganancia funcional; se revisara cuando PEP 695 sea el
    # idioma dominante del ecosistema.
    "UP046",
    "UP047",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"migrations/**" = ["E501"]
# Los scripts de utilidad son herramientas de linea de comandos: su
# salida es `print`, no logging estructurado.
"scripts/**" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ─────────────────────────────────────────────────────────────────────
# Mypy — tipado estricto
# ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["mailauto"]

[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*", "arq.*", "testcontainers.*"]
ignore_missing_imports = true

# Librerias de documento e IA sin tipos publicos o con tipos
# incompletos. Se aislan aqui para que su falta de anotaciones no
# obligue a relajar el modo estricto en el resto del proyecto: los
# adaptadores que las usan si estan tipados en su frontera.
[[tool.mypy.overrides]]
module = ["pymupdf.*", "fitz.*", "pdfplumber.*", "pytesseract.*", "cv2.*", "openpyxl.*", "anthropic.*"]
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_calls = false

# redis-py publica py.typed pero su tipado es parcial: `aclose()` figura
# sin anotar y el cliente asincrono no es generico. Saltar su analisis
# evita falsos positivos sobre codigo correcto, sin relajar el resto.
[[tool.mypy.overrides]]
module = ["redis.*"]
follow_imports = "skip"
ignore_missing_imports = true

# ─────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requiere contenedores (PostgreSQL, Redis, MinIO)",
    "security: verifica controles de seguridad",
]

[tool.coverage.run]
source = ["src/mailauto"]
branch = true
omit = ["*/migrations/*", "*/bootstrap/app.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
    "\\.\\.\\.",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
# B311: `random` solo se usa para el jitter del backoff, que no es un
#       uso criptografico. Los valores que si lo son (state, PKCE,
#       nonces, DEK) salen de `secrets` y de `os.urandom`.
# B105/B106: bandit marca como "contraseña embebida" cualquier asignacion
#       de cadena vacia o None a un campo cuyo nombre contenga "token".
#       Son justo las lineas que BORRAN el token de memoria antes de
#       devolver la entidad al llamante.
skips = ["B311", "B105", "B106"]
