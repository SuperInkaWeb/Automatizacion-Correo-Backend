# ─────────────────────────────────────────────────────────────────────
# Integracion continua.
#
# Los trabajos corren en paralelo salvo donde hay dependencia real: un
# fallo de formato no deberia hacer esperar al resultado de los tests.
#
# `arquitectura` es un trabajo propio y no un paso dentro de `calidad`
# a proposito: cuando falla, el nombre del check en el PR dice
# exactamente que se rompio sin tener que abrir el log.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecucion anterior: no
# tiene sentido gastar minutos en validar un commit ya superado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read

jobs:
  # Las comprobaciones estaticas van en un solo trabajo: las tres
  # necesitan exactamente la misma instalacion de dependencias, y
  # repartirlas en tres runners triplicaba ese coste para ejecutar algo
  # que junto tarda menos de un minuto. Cada paso lleva nombre propio,
  # asi que un fallo sigue diciendo que se rompio sin abrir el log.
  verificacion:
    name: Verificacion estatica
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0` trae el historial completo. Gitleaks escanea un
      # rango de commits (commit-base..HEAD), y con el clon superficial por
      # defecto el padre del rango no esta presente: `git log` escribe un
      # aviso a stderr y gitleaks lo toma por un fallo de escaneo. Solo se
      # nota cuando el push trae mas de un commit, que es cuando el rango
      # llega mas atras que la profundidad por defecto.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Formato
        run: ruff format --check src tests migrations scripts

      - name: Linting
        run: ruff check src tests migrations scripts

      - name: Tipado estricto
        run: mypy --config-file pyproject.toml

      # Verifica que las capas no se han cruzado. Es lo que impide que
      # la arquitectura hexagonal se degrade a base de imports
      # "temporales" que nadie vuelve a quitar.
      - name: Contratos de arquitectura
        run: lint-imports --config importlinter.ini

      - name: SAST
        run: bandit -q -c pyproject.toml -r src

      # Sin `--strict`: esa opcion convierte en error el haberse
      # saltado el propio paquete local (que no esta en PyPI). Las
      # vulnerabilidades siguen devolviendo codigo distinto de cero.
      - name: Dependencias vulnerables
        run: pip-audit --skip-editable

      # Secretos filtrados en cualquier punto del historial, no solo en
      # el ultimo commit: una clave borrada despues sigue estando
      # comprometida y es recuperable.
      - name: Buscar secretos en el historial
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Tests unitarios y de seguridad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # Se excluye `integration` de forma explicita: esas pruebas tienen
      # su propio trabajo con servicios. Sin el marcador se saltarian
      # solas al no encontrar nada escuchando, y un "skipped" silencioso
      # es indistinguible de una prueba que nadie escribio.
      - name: Ejecutar suite
        run: >-
          pytest -q -m "not integration"
          --cov=src/mailauto --cov-report=term-missing --cov-report=xml

      - name: Publicar cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────
  # Lo que no se puede verificar sin infraestructura real.
  #
  # Row Level Security es la razon de que este trabajo exista. Una
  # politica puede estar escrita, declarada y activa, y no filtrar nada:
  # PostgreSQL exime de las politicas al propietario de la tabla y a los
  # superusuarios, asi que basta conectarse con el rol equivocado para
  # anular el aislamiento entre clientes sin que aparezca ningun error.
  # Por eso aqui se provisiona la base igual que en produccion, con el
  # rol de aplicacion separado del propietario, usando el mismo
  # `scripts/init-db.sql` que usa el entorno de desarrollo: si ese script
  # se rompe, se nota aqui.
  # ───────────────────────────────────────────────────────────────────
  integracion:
    name: Tests de integracion
    runs-on: ubuntu-latest
    needs: [verificacion]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mailauto
          POSTGRES_USER: mailauto_owner
          POSTGRES_PASSWORD: desarrollo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mailauto_owner -d mailauto"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

      # Almacen compatible con S3. Puede declararse como servicio porque
      # su imagen arranca sola: no hay que sustituir su comando, que es lo
      # que los contenedores de servicio no permiten.
      almacen:
        image: localstack/localstack:4
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: desarrollo
          AWS_SECRET_ACCESS_KEY: desarrollo-secreto
        ports: ["4566:4566"]
        options: >-
          --health-cmd "curl -sf http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      ENVIRONMENT: testing
      DATABASE_URL: postgresql+asyncpg://mailauto_owner:desarrollo@localhost:5432/mailauto
      REDIS_URL: redis://localhost:6379/0
      OIDC_ISSUER: https://ci.ejemplo.com/
      OIDC_AUDIENCE: https://api.ejemplo.com
      MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      GOOGLE_CLIENT_ID: ci
      GOOGLE_CLIENT_SECRET: ci
      STORAGE_ACCESS_KEY: desarrollo
      STORAGE_SECRET_KEY: desarrollo-secreto
      TEST_DATABASE_URL: postgresql+asyncpg://mailauto_app:desarrollo@localhost:5432/mailauto
      TEST_DATABASE_URL_OWNER: postgresql+asyncpg://mailauto_owner:desarrollo@localhost:5432/mailauto
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_STORAGE_ENDPOINT_URL: http://localhost:4566
      TEST_STORAGE_ACCESS_KEY: desarrollo
      TEST_STORAGE_SECRET_KEY: desarrollo-secreto

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # Crea `mailauto_app` SIN privilegios de propietario. Es la pieza
      # que hace que RLS filtre de verdad, y el test de integracion falla
      # si este paso se salta.
      - name: Provisionar el rol de aplicacion
        env:
          PGPASSWORD: desarrollo
        run: psql -h localhost -U mailauto_owner -d mailauto -v ON_ERROR_STOP=1 -f scripts/init-db.sql

      - name: Aplicar migraciones
        run: alembic upgrade head

      # Los tests se saltan solos cuando no encuentran los servicios, lo
      # cual es correcto en local y peligroso aqui: un trabajo verde sin
      # haber comprobado nada. Por eso se exige que haya pasos superados
      # y ningun salto.
      - name: Ejecutar tests de integracion
        run: |
          set -o pipefail
          pytest -m integration -q --no-header | tee resultado.txt
          grep -qE "[0-9]+ passed" resultado.txt             || { echo "::error::Ningun test de integracion se ejecuto"; exit 1; }
          if grep -qE "[0-9]+ skipped" resultado.txt; then
            echo "::error::Se saltaron tests de integracion: falta algun servicio"
            exit 1
          fi

  contrato-openapi:
    name: Contrato OpenAPI
    runs-on: ubuntu-latest
    needs: [verificacion]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # El esquema generado se versiona y el frontend genera su cliente
      # TypeScript a partir de el. Si cambia la API sin regenerarlo, el
      # contrato se desincroniza en silencio y el frontend se entera en
      # produccion. Aqui se entera en el PR.
      - name: Regenerar y comparar openapi.json
        env:
          ENVIRONMENT: testing
          DATABASE_URL: postgresql+asyncpg://u:p@localhost:5432/ci
          REDIS_URL: redis://localhost:6379/0
          OIDC_ISSUER: https://ci.ejemplo.com/
          OIDC_AUDIENCE: https://api.ejemplo.com
          MASTER_KEY_B64: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GOOGLE_CLIENT_ID: ci
          GOOGLE_CLIENT_SECRET: ci
          STORAGE_ACCESS_KEY: ci
          STORAGE_SECRET_KEY: ci
        run: |
          python scripts/exportar_openapi.py openapi.json
          git diff --exit-code openapi.json \
            || { echo "::error::openapi.json esta desactualizado. Ejecuta scripts/exportar_openapi.py y commitea el resultado."; exit 1; }

  imagenes:
    name: Construccion y escaneo de imagenes
    runs-on: ubuntu-latest
    needs: [verificacion, tests]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Construir imagen de API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: mailauto-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir imagen de worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: false
          load: true
          tags: mailauto-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El worker es el contenedor que abre ficheros de terceros, asi que
      # una CVE en sus bibliotecas nativas importa mas que en ningun otro.
      - name: Escanear imagen de worker
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mailauto-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Escanear imagen de API
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: mailauto-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Generar SBOM
        uses: anchore/sbom-action@v0.24.3
        with:
          image: mailauto-api:ci
          format: spdx-json
          artifact-name: sbom-api.spdx.json
